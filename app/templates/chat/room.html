{% extends "base.html" %}
{% block title %}{{ room_title }}{% endblock %}
{% block content %}
<h1 class="h4 mb-3">{{ room_title }}</h1>
<div id="chat-root" data-room-type="{{ room_type }}" {% if room_id %}data-room-id="{{ room_id }}"{% endif %}></div>
<div id="chat-messages" class="chat-box mb-3">
  {% for msg in messages %}
  <div class="chat-message">
    <div class="meta"><strong>{{ msg.sender_name }}</strong> · {{ msg.created_at.strftime('%Y-%m-%d %H:%M') }}</div>
    <div>{{ msg.content }}</div>
  </div>
  {% endfor %}
</div>
<form id="chat-form" class="input-group">
  <input type="text" id="chat-input" class="form-control" placeholder="輸入訊息..." maxlength="2000" autocomplete="off">
  <button class="btn btn-primary" type="submit">送出</button>
</form>
{% endblock %}
{% block scripts %}
<script src="/static/js/chat.js"></script>
{% endblock %}
