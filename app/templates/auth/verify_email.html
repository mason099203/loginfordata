{% extends "base.html" %}
{% block title %}Email 驗證 - 活動管理系統{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Email 驗證</h1>
        <p class="text-muted small">註冊成功！我們已寄出 6 位數驗證碼至您的 Email，請輸入後完成驗證。</p>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="alert alert-success">{{ success }}</div>
        {% endif %}
        <form method="post" action="/register/verify">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required value="{{ email }}">
          </div>
          <div class="mb-3">
            <label class="form-label">驗證碼</label>
            <input type="text" name="code" class="form-control" required maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" placeholder="000000">
          </div>
          <button type="submit" class="btn btn-primary w-100">確認驗證</button>
        </form>
        <form method="post" action="/register/resend" class="mt-3">
          <input type="hidden" name="email" value="{{ email }}">
          <button type="submit" class="btn btn-outline-secondary w-100">重新寄送驗證碼</button>
        </form>
        <p class="mt-3 mb-0 text-center"><a href="/login">返回登入</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
