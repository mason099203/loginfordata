{% extends "base.html" %}
{% block title %}註冊 - 活動管理系統{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">註冊帳號</h1>
        <p class="text-muted small">填寫有效邀請碼註冊後，需由發放邀請碼的高級使用者確認方可登入；未填邀請碼需等待管理員確認。</p>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" action="/register">
          <div class="mb-3">
            <label class="form-label">顯示名稱</label>
            <input type="text" name="display_name" class="form-control" required maxlength="50">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">密碼（至少 6 字元）</label>
            <input type="password" name="password" class="form-control" required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label">邀請碼（選填）</label>
            <input type="text" name="invite_code" class="form-control text-uppercase"
                   maxlength="20" placeholder="向高級使用者取得" value="{{ invite_code or '' }}">
          </div>
          <button type="submit" class="btn btn-primary w-100">註冊</button>
        </form>
        <p class="mt-3 mb-0 text-center"><a href="/login">已有帳號？登入</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
