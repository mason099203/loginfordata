services:
  - type: web
    name: loginfordata
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: activity_app
      - key: SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@example.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: app/static/uploads
      - key: MAX_UPLOAD_MB
        value: 2
      - key: APP_TIMEZONE
        value: Asia/Taipei
      # Render 免費方案封鎖 SMTP 587/465，請用 Resend HTTP API 寄信
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
